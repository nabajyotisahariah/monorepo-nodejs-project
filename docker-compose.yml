services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - product-service
      - order-service
      - user-service
    restart: unless-stopped

  user-service:
    build: ./apps/user-service
    expose:
      - "3001"
    restart: unless-stopped

  product-service:
    build: ./apps/product-service
    expose:
      - "3002"
    restart: unless-stopped

  order-service:
    build: ./apps/order-service
    expose:
      - "3000"
    restart: unless-stopped