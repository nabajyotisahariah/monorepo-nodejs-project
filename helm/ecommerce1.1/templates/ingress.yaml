{{- if .Values.ingress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ecommerce-route
spec:
  parentRefs:
    - name: {{ .Values.ingress.gatewayName }}
  rules:
    {{- range .Values.ingress.paths }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | quote }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .rewritePrefix | quote }}
      backendRefs:
        - name: {{ .service }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
