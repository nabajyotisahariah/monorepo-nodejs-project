{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ecommerce-ingress

spec:

  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}

  rules:
    - http:
        paths:

          {{- range .Values.ingress.paths }}

          - path: {{ .path }}
            pathType: Prefix

            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ $.Values.service.port }}

          {{- end }}

{{- end }}